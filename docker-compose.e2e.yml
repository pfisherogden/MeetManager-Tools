services:
  backend:
    shm_size: '2gb'
  frontend:
    # Explicitly clear volumes to prevent main docker-compose.yml from mounting host ./web-client
    volumes:
      - mmtools-data:/app/data
      - ./tmp:/app/tmp
    command: ["sh", "-c", "echo 'Waiting for backend:8080 (TCP)...' && until nc -z backend 8080; do sleep 2; done && echo 'Backend is UP, starting Next.js...' && npm start"]
    shm_size: '2gb'
  judge-app:
    image: nginx:stable-alpine
    ports:
      - "8081:80"
    volumes:
      - ./mobile-judge-app/dist:/usr/share/nginx/html
