services:
  backend:
    shm_size: '2gb'
    environment:
      - FRONTEND_URL=http://localhost:3100
      - DATA_ACCESS_TOKEN=${DATA_ACCESS_TOKEN:-mmtools-default-secret-2024}
      - GRPC_AUTH_DISABLED=true
      - PYTHONDONTWRITEBYTECODE=1
  frontend:
    # Use image build for production performance and stability
    volumes:
      - mmtools-data:/app/data
      - ./tmp:/app/tmp
    command: ["sh", "-c", "echo 'Waiting for backend:8080 (TCP)...' && until nc -z backend 8080; do sleep 2; done && echo 'Backend is UP, starting Next.js...' && npm start"]
    shm_size: '2gb'
    environment:
      - WAIT_FOR_BACKEND=true
      - DATA_ACCESS_TOKEN=${DATA_ACCESS_TOKEN:-mmtools-default-secret-2024}
      - USE_MOCK_FIRESTORE=true
      - FIRESTORE_MOCK_PATH=/app/tmp/mock_firestore.json
      - NEXT_PUBLIC_AUTH_DISABLED=${NEXT_PUBLIC_AUTH_DISABLED:-false}
      - NEXT_PUBLIC_E2E_AUTH_BYPASS=${NEXT_PUBLIC_E2E_AUTH_BYPASS:-true}
  judge-app:
    image: nginx:stable-alpine
    ports:
      - "8081:8080"
    volumes:
      - ./mobile-judge-app/dist:/usr/share/nginx/html
      - ./mobile-judge-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
