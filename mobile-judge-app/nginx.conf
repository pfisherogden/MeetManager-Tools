server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle the subdirectory used in GitHub Pages
    location /MeetManager-Tools/judge {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Fallback for root
    location / {
        try_files $uri $uri/ /index.html;
    }
}
