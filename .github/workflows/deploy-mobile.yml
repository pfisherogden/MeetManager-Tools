name: Deploy Mobile Judge App to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  push:
    branches:
      - feat/judge-app-ui-overhaul
    paths:
      - 'mobile-judge-app/**'
      - 'meet-program-viewer/**'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile-judge-app/package-lock.json

      - name: Install dependencies (Judge App)
        working-directory: mobile-judge-app
        run: npm ci --legacy-peer-deps

      - name: Build web (Judge App)
        working-directory: mobile-judge-app
        env:
          APP_BASE_URL: /MeetManager-Tools/judge
        run: |
          npm run prebuild-web
          npm run build-web

      - name: Install dependencies (Viewer App)
        working-directory: meet-program-viewer
        run: npm ci

      - name: Build web (Viewer App)
        working-directory: meet-program-viewer
        env:
          APP_BASE_URL: /MeetManager-Tools/viewer
        run: npm run build-web

      - name: Prepare GitHub Pages Payload
        run: |
          mkdir -p gh-pages-root
          cp -r public/* gh-pages-root/ || true
          mkdir -p gh-pages-root/judge
          cp -r mobile-judge-app/dist/* gh-pages-root/judge/
          mkdir -p gh-pages-root/viewer
          cp -r meet-program-viewer/dist/* gh-pages-root/viewer/
          touch gh-pages-root/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-root
