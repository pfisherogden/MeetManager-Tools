name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'mm_to_json/**'
      - 'protos/**'
      - 'web-client/**'
      - 'mobile-judge-app/**'
      - 'Justfile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'mm_to_json/**'
      - 'protos/**'
      - 'web-client/**'
      - 'mobile-judge-app/**'
      - 'Justfile'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'mobile-judge-app/package-lock.json'

      - name: Install dependencies
        run: |
          uv sync --all-packages --dev
          cd web-client && npm install

      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mdbtools libglib2.0-0t64 libglib2.0-dev libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libffi-dev libjpeg-dev libopenjp2-7-dev libcairo2 libgdk-pixbuf2.0-0

      - name: Lint Protos
        run: just lint-protos

      - name: Generate Protos
        run: just codegen

      - name: Lint with Ruff
        run: |
          just lint-backend
          just lint-mm-to-json

      - name: Type Check Backend
        run: just type-check-backend

      - name: Test with Pytest
        env:
          GRPC_AUTH_DISABLED: "true"
        run: PYTHONPATH=backend/src uv run pytest backend/tests/ --ignore=backend/tests/integration/

  web-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web-client/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Generate Protos
        run: npm run codegen

      - name: Build
        run: npm run build

      - name: Test (Vitest)
        run: npm test

  mobile-judge-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-judge-app
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web-client/package-lock.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build (Expo Web)
        run: npm run build-web

      - name: Test (Jest)
        run: npm test

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Build and Start Services
        run: |
          mkdir -p tmp && chmod 777 tmp
          just build
          just up
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Wait for Services
        run: |
          echo "Waiting for frontend to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "Waiting for judge-app to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Judge App is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web-client/package-lock.json'

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json | tr -d '^~')" >> $GITHUB_OUTPUT
        working-directory: web-client

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: web-client/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('web-client/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          cd web-client
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd web-client
          npx playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: |
          cd web-client
          npx playwright install-deps

      - name: Run Playwright E2E Tests
        run: just test-e2e-sharded ${{ matrix.shardIndex }} ${{ matrix.shardTotal }}
        env:
          FRONTEND_URL: http://localhost:3000
          MOBILE_APP_URL: http://localhost:8080

      - name: Print Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: web-client/playwright-report/
          retention-days: 30

      - name: Run Headless Journeys
        if: matrix.shardIndex == 1
        run: |
          just test-journeys
          just test-dq-sync

      - name: Shutdown Services
        if: always()
        run: just down
