name: CI

on:
  push:
    branches: [ main, fix/e2e-robustness-final ]
    paths:
      - 'backend/**'
      - 'mm_to_json/**'
      - 'protos/**'
      - 'web-client/**'
      - 'mobile-judge-app/**'
      - 'Justfile'
      - 'docker-compose*'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: pfisherogden/mmtools

jobs:
  backend-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Generate Protos
        run: |
          cd backend
          uv run python -m grpc_tools.protoc -I../protos --python_out=src --grpc_python_out=src --pyi_out=src ../protos/meetmanager/v1/meet_manager.proto

      - name: Lint Backend
        run: |
          just lint-backend
          just lint-mm-to-json

      - name: Type Check Backend
        run: just type-check-backend

      - name: Test with Pytest
        env:
          GRPC_AUTH_DISABLED: "true"
        run: PYTHONPATH=backend/src uv run pytest backend/tests/ --ignore=backend/tests/integration/

  web-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web-client/package-lock.json'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        working-directory: web-client
        run: npm ci

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Generate Protos
        run: |
          just codegen
          just codegen-frontend

      - name: Lint and Test
        working-directory: web-client
        run: |
          npm run lint
          npm test

  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web-client/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_E2E_AUTH_BYPASS=true

      - name: Build and push Judge App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mobile-judge-app/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/judge-app:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-tests:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Services
        env:
          TAG: ${{ needs.build-images.outputs.tag }}
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          mkdir -p tmp && chmod -R 777 tmp
          # Pull the images first to ensure they are available
          docker pull ${IMAGE_PREFIX}/backend:${TAG}
          docker pull ${IMAGE_PREFIX}/frontend:${TAG}
          docker pull ${IMAGE_PREFIX}/judge-app:${TAG}
          
          # Use the CI-specific docker-compose file
          docker compose -f docker-compose.ci.yml up -d

      - name: Wait for Services
        run: |
          echo "Waiting for services to initialize..."
          sleep 15
          
          echo "Waiting for backend to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done

          echo "Waiting for frontend to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done

          echo "Waiting for judge-app to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:8081 > /dev/null; then
              echo "Judge App is ready!"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done

      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web-client/package-lock.json'

      - name: Install Playwright
        run: |
          cd web-client
          npm ci
          # MUST install all browsers to support webkit/safari projects
          npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: |
          cd web-client
          npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          FRONTEND_URL: http://localhost:3000
          MOBILE_APP_URL: http://localhost:8081
          NEXT_PUBLIC_E2E_AUTH_BYPASS: 'true'
          SHARD_INDEX: ${{ matrix.shardIndex }}
          IS_E2E: 'true'

      - name: Print Logs
        if: always()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: web-client/playwright-report/
          retention-days: 7

      - name: Shutdown Services
        if: always()
        run: docker compose -f docker-compose.ci.yml down
matrix.shardIndex }}
          path: web-client/playwright-report/
          retention-days: 7

      - name: Shutdown Services
        if: always()
        run: docker compose -f docker-compose.ci.yml down
