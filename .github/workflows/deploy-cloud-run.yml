name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  push:
    branches: [ feat/phase-3-cloud-deployment ]
    paths:
      - 'backend/**'
      - 'web-client/**'
      - 'deploy/**'
      - '.github/workflows/deploy-cloud-run.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: mmtools-488404
  REGION: us-west1
  REPOSITORY: mmtools
  BACKEND_SERVICE: mmtools-backend
  FRONTEND_SERVICE: mmtools-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Authentication with Google Cloud
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Authorize Docker push'
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      # Build and Push Backend
      - name: Build and Push Backend Image
        run: |
          docker build -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${BACKEND_SERVICE}:${{ github.sha }} -f backend/Dockerfile .
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${BACKEND_SERVICE}:${{ github.sha }}

      # Build and Push Frontend
      - name: Build and Push Frontend Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ env.PROJECT_ID }}.firebaseapp.com \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ env.PROJECT_ID }}.firebasestorage.app \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-KDE7ZPS0X5 \
            --build-arg NEXT_PUBLIC_GOOGLE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --build-arg NEXT_PUBLIC_AUTH_DISABLED=false \
            --build-arg NEXT_PUBLIC_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${FRONTEND_SERVICE}:${{ github.sha }} -f web-client/Dockerfile .
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${FRONTEND_SERVICE}:${{ github.sha }}

      - name: Record Deployment Start Timestamp
        run: echo "DEPLOY_START_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      # Deploy Backend to Cloud Run
      - name: Deploy Backend
        id: deploy-backend
        uses: 'google-github-actions/deploy-cloudrun@v3'
        with:
          service: '${{ env.BACKEND_SERVICE }}'
          image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}'
          region: '${{ env.REGION }}'
          flags: '--allow-unauthenticated --memory 2Gi --cpu 1 --timeout 600s --cpu-throttling --max-instances 2'
          env_vars: |
            GCS_BUCKET_NAME=mmtools-data-mmtools-488404
            LOG_LEVEL=INFO
            PYTHONUNBUFFERED=1
            DATA_ACCESS_TOKEN=${{ secrets.DATA_ACCESS_TOKEN }}

      # Deploy Frontend to Cloud Run
      - name: Deploy Frontend
        id: deploy-frontend
        uses: 'google-github-actions/deploy-cloudrun@v3'
        with:
          service: '${{ env.FRONTEND_SERVICE }}'
          image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}'
          region: '${{ env.REGION }}'
          flags: '--allow-unauthenticated --timeout 600s'
          env_vars: |
            BACKEND_INTERNAL_HOST=${{ steps.deploy-backend.outputs.url }}
            BACKEND_USE_SSL=true
            DATA_ACCESS_TOKEN=${{ secrets.DATA_ACCESS_TOKEN }}
            NEXT_PUBLIC_AUTH_DISABLED=false
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            NEXT_PUBLIC_GOOGLE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            GOOGLE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ env.PROJECT_ID }}.firebaseapp.com
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ env.PROJECT_ID }}.firebasestorage.app
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-KDE7ZPS0X5
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

      # Post-Deployment Verification (Issue #231)
      - name: Install uv for Post-Deployment Verifier
        uses: astral-sh/setup-uv@v7

      - name: Mint Firebase Custom Token for Production E2E
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          TOKEN=$(cd backend && PYTHONPATH=src uv run python -m mm_to_json.cloud_run_verifier --mint-custom-token --uid prod-test-admin)
          echo "::add-mask::${TOKEN}"
          echo "FIREBASE_CUSTOM_TOKEN=${TOKEN}" >> $GITHUB_ENV

      - name: Set up Node.js for Production E2E
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-client/package-lock.json

      - name: Install Playwright & Run Production E2E Smoke Suite
        id: e2e-verify
        continue-on-error: true
        working-directory: web-client
        env:
          CI: 'true'
          FRONTEND_URL: ${{ steps.deploy-frontend.outputs.url }}
          FIREBASE_CUSTOM_TOKEN: ${{ env.FIREBASE_CUSTOM_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test tests-e2e/production.spec.ts

      - name: Audit Cloud Run Logs & Auto-File Issue on Failure
        if: always() && steps.deploy-frontend.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          E2E_STATUS="passed"
          if [ "${{ steps.e2e-verify.outcome }}" != "success" ]; then
            E2E_STATUS="failed"
          fi
          cd backend && PYTHONPATH=src uv run python -m mm_to_json.cloud_run_verifier \
            --audit-logs \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --services "${{ env.BACKEND_SERVICE }}" "${{ env.FRONTEND_SERVICE }}" \
            --min-timestamp "${{ env.DEPLOY_START_TIME }}" \
            --e2e-status "${E2E_STATUS}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --auto-file-issue

