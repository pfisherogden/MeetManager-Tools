name: Compile & Package Desktop Clients

on:
  push:
    branches:
      - main
      - 'feature/desktop-client'
      - 'feat/desktop*'
      - 'fix/desktop*'
  pull_request:
    paths:
      - 'web-client/src-tauri/**'
      - 'web-client/lib/tauri-bridge.ts'
      - 'backend/src/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            sidecar_ext: ""
            output_name: mmtools-backend-aarch64-apple-darwin
          - os: windows-latest
            platform: windows
            sidecar_ext: ".exe"
            output_name: mmtools-backend-x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install UV and Python Dependencies
        shell: bash
        run: |
          pip install uv
          cd backend
          uv pip install --system -e .
          uv pip install --system pyinstaller
          uv run python src/mm_to_json/download_libs.py

      - name: Install Pango/Cairo on macOS
        if: matrix.platform == 'macos'
        run: |
          brew install pango cairo

      - name: Install Pango/Cairo DLLs on Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          c:/msys64/usr/bin/bash -lc "pacman -Syy --noconfirm --needed mingw-w64-x86_64-pango"
          mkdir -p backend/src/mm_to_json/lib
          cp /c/msys64/mingw64/bin/*.dll backend/src/mm_to_json/lib/

      - name: Package Python Backend with PyInstaller
        shell: bash
        run: |
          cd backend
          if [ "${{ matrix.platform }}" = "windows" ]; then
            pyinstaller --onefile --add-data "data/Sample_Data.json;data" --add-data "src/mm_to_json/jre;mm_to_json/jre" --add-data "src/mm_to_json/lib;mm_to_json/lib" --add-data "src/mm_to_json/reporting/templates;mm_to_json/reporting/templates" --name ${{ matrix.output_name }} src/server.py
          else
            pyinstaller --onefile --add-data "data/Sample_Data.json:data" --add-data "src/mm_to_json/jre:mm_to_json/jre" --add-data "src/mm_to_json/lib:mm_to_json/lib" --add-data "src/mm_to_json/reporting/templates:mm_to_json/reporting/templates" --name ${{ matrix.output_name }} src/server.py
          fi
          
          # Move output to Tauri's sidecars directory in web-client if it exists
          if [ -d "../web-client/src-tauri" ]; then
            mkdir -p ../web-client/src-tauri/binaries
            cp dist/${{ matrix.output_name }}${{ matrix.sidecar_ext }} ../web-client/src-tauri/binaries/
          else
            echo "web-client/src-tauri not found. Skipping sidecar binary copy."
          fi

      - name: Validate Packaged Sidecar Binary
        shell: bash
        run: |
          cd backend
          echo "Testing packaged binary execution..."
          dist/${{ matrix.output_name }}${{ matrix.sidecar_ext }} --check-weasyprint

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web-client/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd web-client
          npm ci

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Generate Protos
        run: |
          just codegen
          just codegen-frontend

      - name: Compile Frontend (Next.js Production Build)
        env:
          NEXT_PUBLIC_AUTH_DISABLED: "true"
        run: |
          cd web-client
          npm run build

      - name: Set up Rust (Tauri Compiler Toolchain)
        if: hashFiles('web-client/src-tauri/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        if: hashFiles('web-client/src-tauri/Cargo.toml') != ''
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./web-client/src-tauri -> target"

      - name: Build Tauri Desktop Client
        if: hashFiles('web-client/src-tauri/Cargo.toml') != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          cd web-client
          npm install -g @tauri-apps/cli
          # Builds the installer for the host operating system
          npx tauri build

      - name: Upload Installer Artifacts
        if: hashFiles('web-client/src-tauri/Cargo.toml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mmtools-desktop-${{ matrix.platform }}
          path: |
            web-client/src-tauri/target/release/bundle/msi/*.msi
            web-client/src-tauri/target/release/bundle/dmg/*.dmg
            web-client/src-tauri/target/release/bundle/macos/*.app
            scripts/trust-app.command

  release-desktop:
    needs: build-desktop
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mmtools-desktop-macos
          path: ./artifacts-macos

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mmtools-desktop-windows
          path: ./artifacts-windows

      - name: Package and Rename Binaries
        shell: bash
        run: |
          mkdir -p release-binaries
          # Find and copy dmg
          find ./artifacts-macos -name "*.dmg" -exec cp {} ./release-binaries/MM-Tools-macOS.dmg \;
          # Find and copy msi
          find ./artifacts-windows -name "*.msi" -exec cp {} ./release-binaries/MM-Tools-Windows.msi \;

      - name: Upload binaries to latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete tag and release if they exist
          gh release delete latest --yes || true
          gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/latest || true
          
          # Create new latest release and upload renamed binaries
          gh release create latest \
            --title "Latest Desktop Release" \
            --notes "Automated build of the latest desktop application." \
            --prerelease \
            ./release-binaries/MM-Tools-macOS.dmg \
            ./release-binaries/MM-Tools-Windows.msi
