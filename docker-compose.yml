services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8090:8080"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/tests/fixtures:/app/tests/fixtures
      - ./tmp:/app/tmp
      - mmtools-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - GRPC_AUTH_DISABLED=true
      - LOG_LEVEL=DEBUG
      - DATA_ACCESS_TOKEN=${DATA_ACCESS_TOKEN:-mmtools-default-secret-2024}

  frontend:
    build:
      context: .
      dockerfile: web-client/Dockerfile
      args:
        - NEXT_PUBLIC_AUTH_DISABLED=true
        - NEXT_PUBLIC_E2E_AUTH_BYPASS=true
        - NEXT_PUBLIC_BACKEND_PORT=8090
        - NEXT_PUBLIC_BUILD_TIME=2026-03-15T00:00:00Z
    ports:
      - "3100:3000"
    volumes:
      - ./web-client:/app
      - ./tmp:/app/tmp
      - /app/node_modules
      - mmtools-data:/app/data
    command: ["sh", "-c", "echo 'Waiting for backend:8080 (TCP)...' && until nc -z backend 8080; do sleep 2; done && echo 'Backend is UP, starting Next.js...' && npm run dev"]
    environment:
      - BACKEND_INTERNAL_HOST=backend:8080
      - NEXT_PUBLIC_AUTH_DISABLED=true
      - NEXT_PUBLIC_E2E_AUTH_BYPASS=true
      - DATA_ACCESS_TOKEN=${DATA_ACCESS_TOKEN:-mmtools-default-secret-2024}
      - USE_MOCK_FIRESTORE=true
      - FIRESTORE_MOCK_PATH=/app/tmp/mock_firestore.json
    depends_on:
      - backend

volumes:
  mmtools-data:
