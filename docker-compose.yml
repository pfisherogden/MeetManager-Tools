services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # - ./backend/data:/app/data # Removed to fix locking issues on macOS
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/tests/fixtures:/app/tests/fixtures
      - ./tests/fixtures/anonymized_meets:/app/tests/fixtures/anonymized_meets
      - ./protos:/app/protos
      - ./tmp:/app/tmp
      # Anonymous volumes to keep high-churn files inside the VM (hole punching)
      - /app/src/__pycache__
      - /app/tests/__pycache__
      - /app/.pytest_cache
      - /app/.venv
      - /app/src/mm_to_json/lib
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - GRPC_AUTH_DISABLED=true
      - DATA_ACCESS_TOKEN=${DATA_ACCESS_TOKEN:-mmtools-default-secret-2024}

  frontend:
    build:
      context: .
      dockerfile: web-client/Dockerfile
      args:
        - NEXT_PUBLIC_AUTH_DISABLED=true
        - NEXT_PUBLIC_BUILD_TIME=2026-03-15T00:00:00Z
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./tmp:/app/tmp
    environment:
      - BACKEND_INTERNAL_HOST=backend:8080
      - NEXT_PUBLIC_AUTH_DISABLED=true
      - NEXT_PUBLIC_E2E_AUTH_BYPASS=true
      - DATA_ACCESS_TOKEN=${DATA_ACCESS_TOKEN:-mmtools-default-secret-2024}
      - USE_MOCK_FIRESTORE=true
      - FIRESTORE_MOCK_PATH=/app/tmp/mock_firestore.json
    depends_on:
      - backend

  judge-app:
    build:
      context: .
      dockerfile: mobile-judge-app/Dockerfile
    ports:
      - "${MOBILE_APP_PORT:-8082}:8080"
