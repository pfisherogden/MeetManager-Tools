services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    volumes:
      # - ./backend/data:/app/data # Removed to fix locking issues on macOS
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/tests/fixtures:/app/tests/fixtures
      - ./tests/fixtures/anonymized_meets:/app/tests/fixtures/anonymized_meets
      - ./protos:/app/protos
      - ./tmp:/app/tmp
      # Anonymous volumes to keep high-churn files inside the VM (hole punching)
      - /app/src/__pycache__
      - /app/tests/__pycache__
      - /app/.pytest_cache
      - /app/.venv
      - /app/src/mm_to_json/lib
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - GRPC_AUTH_DISABLED=true

  frontend:
    build:
      context: .
      dockerfile: web-client/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: npm run dev
    volumes:
      - ./web-client:/app
      - ./protos:/app/protos
      # Hole punching for high-churn frontend directories
      - /app/node_modules
      - /app/.next
    environment:
      - BACKEND_INTERNAL_HOST=backend:8080
      - NEXT_PUBLIC_AUTH_DISABLED=true
    depends_on:
      - backend
