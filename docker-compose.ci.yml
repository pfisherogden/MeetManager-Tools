services:
  backend:
    image: ${IMAGE_PREFIX}/backend:${TAG}
    ports:
      - "8080:8080"
    volumes:
      - ./tmp:/tmp
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=INFO

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${TAG}
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8080
      - NEXT_PUBLIC_E2E_AUTH_BYPASS=true

  judge-app:
    image: ${IMAGE_PREFIX}/judge-app:${TAG}
    ports:
      - "8081:8080"
