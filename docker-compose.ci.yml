services:
  backend:
    image: ${IMAGE_PREFIX}/backend:${TAG}
    ports:
      - "8080:8080"
    volumes:
      - ./tmp:/tmp
      - mmtools-data:/app/data
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=INFO
      - FRONTEND_URL=http://localhost:3000
      - DATA_ACCESS_TOKEN=mmtools-default-secret-2024
      - GRPC_AUTH_DISABLED=true
      - JUDGE_APP_URL=http://localhost:8081

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${TAG}
    ports:
      - "3000:3000"
    volumes:
      - mmtools-data:/app/data
    environment:
      - BACKEND_INTERNAL_HOST=backend:8080
      - NEXT_PUBLIC_E2E_AUTH_BYPASS=true
      - DATA_ACCESS_TOKEN=mmtools-default-secret-2024

  judge-app:
    image: ${IMAGE_PREFIX}/judge-app:${TAG}
    ports:
      - "8081:8080"

volumes:
  mmtools-data:
