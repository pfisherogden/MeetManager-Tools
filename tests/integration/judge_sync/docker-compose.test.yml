version: '3.8'

services:
  judge-app:
    build:
      context: ../../../
      dockerfile: mobile-judge-app/Dockerfile
    ports:
      - "8080:8080"

  mock-server:
    image: python:3.11-slim
    volumes:
      - .:/app
    working_dir: /app
    command: python mock_server.py 8081
    ports:
      - "8081:8081"

  test-runner:
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - NODE_PATH=/usr/local/lib/node_modules
    command: >
      sh -c "npm install && npx playwright test"
    depends_on:
      - judge-app
      - mock-server
